packages:
  - 'api'
  - 'web'
  - 'mobile'

# pnpm 12 exige declarar qué dependencias pueden ejecutar scripts de build.
# Sin esto, bcrypt y @swc/core no compilan su binario nativo.
allowBuilds:
  '@parcel/watcher': true
  '@scarf/scarf': true
  '@swc/core': true
  bcrypt: true
  esbuild: true
  unrs-resolver: true

minimumReleaseAge: 0
minimumReleaseAgeStrict: false

# Excepciones de auditoría (pnpm audit). Cada una con motivo y fecha de revisión en
# SECURITY.md §4. Solo vulnerabilidades de herramientas de compilación del móvil sin
# versión corregida; se reevalúan al actualizar el SDK de Expo.
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv # node-forge — vía herramientas de Expo, sin parche
    - GHSA-vfj7-8cjw-p6xm # braces — vía herramientas de Expo, sin parche
    - GHSA-mrhx-c7xc-m3w5 # zod 3 — solo en @expo/cli; el parche existe solo para zod 4
