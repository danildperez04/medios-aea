# Dependabot abre PR para mantener al día dependencias, acciones e imágenes base.
# Los PR llegan agrupados para no inundar la bandeja; las actualizaciones de
# seguridad llegan aparte y en cuanto se publican.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: America/Managua
    target-branch: develop
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
    labels: ['tipo:deuda', 'área:infra']
    groups:
      api:
        patterns:
          ['@nestjs/*', 'typeorm', 'pg', 'class-*', 'passport*', 'bcrypt', 'helmet', 'joi', 'rxjs']
        update-types: [minor, patch]
      web:
        patterns:
          [
            '@mui/*',
            'react*',
            '@tanstack/*',
            'vite',
            '@vitejs/*',
            'zod',
            '@hookform/*',
            'axios',
            'zustand',
          ]
        update-types: [minor, patch]
      tooling:
        patterns:
          [
            'eslint*',
            '@eslint/*',
            'typescript*',
            'prettier',
            'vitest',
            '@vitest/*',
            '@commitlint/*',
            'husky',
            'lint-staged',
            '@types/*',
          ]
        update-types: [minor, patch]
    ignore:
      # El SDK de Expo fija versiones compatibles entre sí: se actualiza con
      # `pnpm exec expo install --fix` al cambiar de SDK, no paquete por paquete.
      - dependency-name: 'expo*'
      - dependency-name: '@expo/*'
      - dependency-name: '@expo-google-fonts/*'
      - dependency-name: 'react-native*'
      - dependency-name: '@react-native-community/*'
      - dependency-name: '*-expo'
      # El SDK también fija React: el móvil debe usar la misma versión exacta que su
      # react-native. La web sube React a mano, junto con el SDK del móvil.
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: '@types/react'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Managua
    target-branch: develop
    commit-message:
      prefix: ci
      include: scope
    labels: ['tipo:deuda', 'área:infra']
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directories: ['/api', '/web']
    schedule:
      interval: weekly
      day: monday
      timezone: America/Managua
    target-branch: develop
    commit-message:
      prefix: build
      include: scope
    labels: ['tipo:deuda', 'área:infra']
    ignore:
      # Node sigue en la LTS que usa la CI (NODE_VERSION en ci.yml); el cambio de
      # versión mayor se hace a mano en las dos partes a la vez.
      - dependency-name: node
        update-types: ['version-update:semver-major']
