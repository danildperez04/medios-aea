name: Release

# 1) release-please lee los Conventional Commits que llegan a main y mantiene abierto
#    un PR de release (versión + CHANGELOG). Al mergearlo crea la etiqueta vX.Y.Z y el
#    GitHub Release.
# 2) Si se creó un release, se publican las imágenes en GHCR con esa versión.
#
# Ambos pasos van en este mismo workflow porque un release creado con GITHUB_TOKEN no
# dispara otros workflows: un "on: release" separado nunca se ejecutaría.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Versión y CHANGELOG
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # etiqueta, Release y CHANGELOG
      pull-requests: write # PR de release
      issues: write # etiquetas autorelease
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  images:
    name: Publicar imagen ${{ matrix.app }}
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # publicar en ghcr.io
    strategy:
      fail-fast: true
      matrix:
        app: [api, web]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/medios-aea-${{ matrix.app }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=v${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ env.VERSION }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=medios-aea-${{ matrix.app }}
            org.opencontainers.image.description=Medios AeA — ${{ matrix.app }}
      - name: Construir (sin publicar) para escanear
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.app }}/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Escanear vulnerabilidades (bloquea con CRITICAL corregibles)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Publicar con procedencia y SBOM
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.app }}
