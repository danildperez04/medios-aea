# Cabeceras de seguridad. Se incluyen en el server Y en cada location que declara
# su propio add_header: nginx descarta las heredadas en cuanto un bloque define una.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
