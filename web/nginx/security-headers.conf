# Cabeceras de seguridad. Se incluyen en el server Y en cada location que declara
# su propio add_header: nginx descarta las heredadas en cuanto un bloque define una.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Content-Security-Policy: solo se ejecutan scripts del propio origen, así un XSS no
# puede cargar código de afuera ni enviar el token a otro dominio (connect-src 'self').
# style-src necesita 'unsafe-inline': MUI (Emotion) inserta <style> en tiempo de ejecución.
# Fuentes e imágenes pueden venir como data: porque Vite incrusta los archivos pequeños.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
